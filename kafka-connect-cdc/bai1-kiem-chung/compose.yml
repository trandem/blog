# Dich vu bo sung cho kich ban kiem chung bai 1. Dung kem docker-compose.yml goc qua chung.sh
# (COMPOSE_FILE gom ca hai file). Moi dich vu moi nam trong mot profile rieng de chi bat khi can.
services:
  connect:
    environment:
      OFFSET_FLUSH_INTERVAL_MS: ${OFFSET_FLUSH_MS:-5000}
      HEAP_OPTS: ${CONNECT_HEAP:--Xms256m -Xmx768m}

  # Worker thu hai cung group.id: thu failover giua hai worker.
  connect2:
    profiles: ["worker2"]
    image: quay.io/debezium/connect:3.6.3.Final
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      BOOTSTRAP_SERVERS: kafka:9092
      GROUP_ID: connect-cluster
      CONFIG_STORAGE_TOPIC: connect-configs
      OFFSET_STORAGE_TOPIC: connect-offsets
      STATUS_STORAGE_TOPIC: connect-status
      OFFSET_FLUSH_INTERVAL_MS: 5000
      HEAP_OPTS: "-Xms256m -Xmx512m"
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:8083/connectors > /dev/null"]
      interval: 5s
      timeout: 5s
      retries: 60

  # Replica GTID cua MySQL nguon. Co y khong truyen --log-bin, --binlog-format... de xem gia tri mac dinh.
  mysql2:
    profiles: ["gtid"]
    image: mysql:8.0.41
    command: ["--server-id=2", "--gtid-mode=ON", "--enforce-gtid-consistency=ON"]
    environment:
      MYSQL_ROOT_PASSWORD: root
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -proot --silent"]
      interval: 3s
      retries: 60

  # PostgreSQL lam nguon CDC: can wal_level=logical.
  pgsrc:
    profiles: ["pgsrc"]
    image: postgres:16.14
    command: ["postgres", "-c", "wal_level=logical"]
    environment:
      POSTGRES_USER: src
      POSTGRES_PASSWORD: src
      POSTGRES_DB: shop
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U src -d shop"]
      interval: 3s
      retries: 30
